[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kingyo-orchestrator"
version = "0.1.0"
description = "An observe-first workspace for BigQuery and Dataform orchestration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
incremental = ["duckdb>=1.1,<2", "sqlglot>=30.21,<31"]
lineage = ["sqlglot>=30.21,<31"]
bench = ["duckdb>=1.1,<2", "benchbox==0.4.1"]
dev = ["build>=1.2,<2", "pytest>=8,<10", "ruff>=0.15,<0.16"]

[project.scripts]
kingyo = "kingyo_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kingyo_orchestrator.incremental" = ["sample_repo/definitions/*.sqlx"]

[tool.pytest.ini_options]
testpaths = ["tests", "bench"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# benchmark scenarios and the SSB repo generator embed long SQL strings
"bench/*" = ["E501"]
"tests/test_bench.py" = ["E501"]
# column-relevance tests embed BigQuery SQL strings
"tests/test_lineage_sqlglot.py" = ["E501"]
# the incremental prototype embeds long SQL strings and log messages
"src/kingyo_orchestrator/incremental/*" = ["E501"]
"tests/incremental/*" = ["E501"]
